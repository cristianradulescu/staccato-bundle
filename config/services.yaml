# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is imported by Staccato\StaccatoBundle::loadExtension() and wires
# the bundle's own services into whatever application requires this package.
# It is not meant to be edited by consumers of the bundle.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Makes classes in src/ available as services.
    # Model/ contains plain DTOs that are never fetched from the container,
    # and the bundle class itself has no business being a service.
    Staccato\:
        resource: '../src/'
        exclude:
            - '../src/StaccatoBundle.php'
            - '../src/Model/'
